name: Install uploaded SHADY SPILT update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  install-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract update package
        run: |
          test -f SHADY-SPILT-bot-update.zip
          unzip -o SHADY-SPILT-bot-update.zip -d .
          # Force a fresh cache after installing package assets
          sed -i "s/shady-spilt-v2/shady-spilt-v3/" sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js README.md manifest.webmanifest bot tests Icons .github/workflows/pages.yml
          if git diff --cached --quiet; then
            echo "Package contents already installed"
          else
            git commit -m "Install SHADY SPILT bot update"
            git push origin main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
