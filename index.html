<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>SHADY SPILT</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="SHADY SPILT">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SHADY SPILT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="Icons/favicon.png">
<link rel="apple-touch-icon" href="Icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* التصميم: دفتر تدريب بعمود واحد، تبويبات سفلية، أرقام كبيرة بخط Changa، لمسة نحاسية للتمييز، ألوان ثابتة للماكروز */
:root{
  --bg:#050506; --surface:#101012; --surface2:#1a1a1d; --line:#2c2c31;
  --fg:#f1f1f3; --muted:#9b9ba3;
  --accent:#f50d16; --accent-ink:#ffffff; --accent-soft:#2b0709;
  --silver:#c9ccd2; --silver2:#8e929b;
  --p:#9fb4d6; --c:#d9dce2; --f:#ff5a4d;
  --good:#3ecf8e; --warn:#ffb020; --bad:#ff4d4d;
  --body:#2a2a2e; --muscle:#4a4a50;
  --a-sk:#202024; --a-skl:#3a3a40; --a-ms:#4a2a2c; --a-mst:#8a4a4d; --a-fb:#7a4548; --a-un:#2a2a2f; --a-h0:#f50d16; --a-h1:#ff6b6b; --a-h2:#b00a12; --a-h3:#ffb3b3; --a-fon:#2a0003;
  --ff:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --fd:'Changa','IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --r:12px;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ff);font-size:15px;line-height:1.6;direction:rtl;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin-inline:auto;padding-block:6px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;padding-block:10px 2px}
.top h1{font-family:var(--fd);font-size:24px;font-weight:800;margin:0;letter-spacing:.2px}
.grow{flex:1;min-width:0}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
h2{font-family:var(--fd);font-size:19px;font-weight:700;margin:24px 0 10px;text-wrap:balance}
h3{font-size:16px;font-weight:600;margin:0 0 8px;text-wrap:balance}
p{margin:0 0 8px}
.muted{color:var(--muted)} .sm{font-size:13.5px} .xs{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.rw{flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.num{font-family:var(--fd);font-weight:700;font-variant-numeric:tabular-nums}
.big{font-size:34px;line-height:1.1}
.stat{background:var(--surface2);border-radius:8px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--fd);font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.up{color:var(--good)} .dn-c{color:var(--bad)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:42px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:5px 12px;min-height:34px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.fw{flex-wrap:wrap;overflow:visible}
input,select,textarea{font:inherit;font-size:16px;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.p i{background:var(--p)} .bar.c i{background:var(--c)} .bar.f i{background:var(--f)} .bar.bad i{background:var(--bad)} .bar.good i{background:var(--good)}
.mb{margin-bottom:10px}
.mb-h{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.mb-h b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.ring{width:140px;height:140px;flex:none}
.rg-bg{fill:none;stroke:var(--surface2);stroke-width:12}
.rg-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round}
.rg-n{font-family:var(--fd);font-size:30px;font-weight:800;fill:var(--fg)}
.rg-s{font-size:11px;fill:var(--muted)}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;margin-block:12px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:14px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.tag{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:12px;color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px}
ul.ls{margin:6px 0;padding-inline-start:20px}
ul.ls li{margin-bottom:3px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{display:flex;max-width:760px;margin-inline:auto}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;background:none;border:0;color:var(--muted);font-size:11.5px;cursor:pointer;min-height:56px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button.on{color:var(--accent);font-weight:600}
.bchat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.bmsg{max-width:94%;padding:11px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface2);white-space:pre-line;line-height:1.7;overflow-wrap:anywhere}
.bmsg.user{align-self:flex-start;background:var(--accent-soft);border-color:#5b171b;border-end-start-radius:4px}
.bmsg.bot{align-self:flex-end;border-end-end-radius:4px}
.bmsg .bchips{margin-top:8px;white-space:normal}
.bmsg.typing{display:flex;gap:5px;align-items:center;padding:14px 16px}
.bmsg.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bdot 1s infinite ease-in-out}
.bmsg.typing span:nth-child(2){animation-delay:.15s}.bmsg.typing span:nth-child(3){animation-delay:.3s}
@keyframes bdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.bpanel{margin-top:4px}
.bcrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.bcrow.bad{opacity:.85}.bcrow.bad .bcn b{color:var(--warn)}
.bcn{min-width:0;display:flex;flex-direction:column}.bcn b{font-weight:600;overflow-wrap:anywhere}
.bcg{display:flex;align-items:center;gap:4px}.bcg input{width:64px;padding:6px 4px;text-align:center;font-size:15px}
.bcx{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;color:var(--muted)}
.bctot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:10px}
.bpills{display:flex;gap:6px;flex-wrap:wrap}.bp{font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.bp.p{color:var(--p)}.bp.c{color:var(--c)}.bp.f{color:var(--f)}
.bot-entry{display:flex;gap:8px;position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0;z-index:5}.bot-entry input{flex:1;min-width:0}.bot-entry button{white-space:nowrap}
.list-row{display:flex;width:100%;text-align:right;gap:10px;align-items:center;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.list-row:last-child{border-bottom:0}
.list-row .grow b{font-weight:600}
.kc{font-family:var(--fd);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;max-height:90vh;overflow:auto;max-width:760px;margin-inline:auto;padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-h h3{margin:0}
.restbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding-inline:max(12px,env(safe-area-inset-left,0px))}
.restbar .in{background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px;width:100%;max-width:520px}
.restbar .num{font-size:24px;min-width:70px}
.restbar button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw;font-size:14px}
.ex-card{margin-top:12px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.srow{display:grid;grid-template-columns:30px 1fr 1fr 1fr 42px;gap:6px;align-items:center;margin-bottom:6px}
.srow.h{font-size:12px;color:var(--muted);margin-bottom:2px}
.srow input{text-align:center;padding:8px 4px}
.srow .pv{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.srow .sn{font-family:var(--fd);font-weight:700;text-align:center;color:var(--muted)}
.dn{width:42px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;display:grid;place-items:center}
.dn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4}
.dn.on{background:var(--good);border-color:var(--good);color:#fff}
.srow.done input{opacity:.65}
.pr{color:var(--accent);font-weight:700;font-size:12px}
.body{width:100%;max-width:420px;height:auto;display:block;margin-inline:auto;touch-action:manipulation}
.body.female{transform:none;transform-origin:50% 50%}.body.female .bb{fill:#30272d;stroke:#a98798}.body.female .ms{stroke:#b77b87}.body.female .fb{stroke:#c49aa5}
.bb{fill:var(--a-sk);stroke:var(--a-skl);stroke-width:.8}
.ms{fill:var(--a-ms);stroke:var(--a-mst);stroke-width:.7;stroke-linejoin:round}
.mu{cursor:pointer}.mu.un{cursor:default}
.mu.on .ms.h0{fill:var(--a-h0)}.mu.on .ms.h1{fill:var(--a-h1)}.mu.on .ms.h2{fill:var(--a-h2)}.mu.on .ms.h3{fill:var(--a-h3)}
.un .ms{fill:var(--a-un)}
/* خطوط الألياف: إبراز كل حزمة داخل حدود العضلة بدل خطوط باهتة */
.fb{fill:none;stroke:var(--a-fb);stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round;opacity:.92;pointer-events:none}
.mu.on .fb{stroke:var(--a-fon);stroke-width:1.35;opacity:1}
.body .ms{stroke-width:1.05}
.body .mu.on .ms{stroke-width:1.35;filter:brightness(1.12)}
.body .mu.part-on .ms{fill:#ffcf72!important;stroke:#fff2cc!important;stroke-width:2.2!important;filter:brightness(1.2)}
.body .mu.part-off{opacity:.34}
.anatomy-parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.anatomy-part{display:flex;align-items:center;gap:8px;text-align:right;white-space:normal;min-height:48px}
.anatomy-part .rank{flex:none}
.anatomy-part.on{border-color:var(--accent);background:var(--accent-soft)}
@media(max-width:390px){.anatomy-parts{grid-template-columns:1fr}}
.sh{fill:url(#shd);pointer-events:none}
.gh .ms{fill:none;stroke:#a8660a;stroke-dasharray:3 2;opacity:.6}.gh .fb,.gh .sh{display:none}
.groove{stroke:var(--a-mst);stroke-width:.9;fill:none;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;border:1px solid var(--a-mst)}
.sw.h0{background:var(--a-h0)}.sw.h1{background:var(--a-h1)}.sw.h2{background:var(--a-h2)}.sw.h3{background:var(--a-h3)}
.ch{width:100%;height:auto;display:block;direction:ltr}
.ch text{font-size:11px;fill:var(--muted);font-family:var(--ff)}
.ch .gl{stroke:var(--line);stroke-width:1}
.ch .ln{stroke:var(--accent);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch .ma{stroke:var(--p);stroke-width:1.6;fill:none;stroke-dasharray:4 3}
.ch .ar{fill:var(--accent);opacity:.12}
.ch .pt{fill:var(--accent)}
details{border-top:1px solid var(--line);padding-block:8px}
details summary{cursor:pointer;font-weight:600;padding-block:4px}
.sec-t{font-family:var(--fd);font-size:16px;font-weight:700;margin:18px 0 6px}
.rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;flex:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

html{background:#050506}
body{background:radial-gradient(120% 60% at 50% -10%,#2a0509 0%,#050506 55%) fixed;min-height:100vh}
.top{padding-block:max(10px,env(safe-area-inset-top,0px)) 4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:46px;height:46px;border-radius:12px;box-shadow:0 0 0 1px #5a0a0e,0 0 16px rgba(245,13,22,.45);flex:none}
.brand .nm{display:flex;flex-direction:column;line-height:1}
.brand .n1{font-family:var(--fd);font-weight:800;font-size:21px;letter-spacing:1.5px;background:linear-gradient(180deg,#fff 0%,#c9ccd2 45%,#7d818a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.brand .n2{font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:3px;color:var(--accent);text-shadow:0 0 12px rgba(245,13,22,.55);direction:ltr;margin-top:1px}
.top h1{display:none}
h2{background:linear-gradient(180deg,#fff,#b6b9c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:linear-gradient(180deg,#141416,#0d0d0f);border-color:#2a2a2f;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.45)}
.btn{background:linear-gradient(180deg,#ff2530,#d6000b);box-shadow:0 0 0 1px #7a0006,0 4px 14px rgba(245,13,22,.35);text-shadow:0 1px 0 rgba(0,0,0,.35);letter-spacing:.2px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--fg);border:1px solid #3a3a41;text-shadow:none}
.btn.danger{background:transparent;box-shadow:none;text-shadow:none}
.chip.on{background:linear-gradient(180deg,#ff2530,#d6000b);border-color:#7a0006;color:#fff}
.seg{background:#0d0d0f;border:1px solid #232327}
.seg button.on{background:#1d1d21;color:#fff;box-shadow:0 0 0 1px #4a0b0f,0 0 10px rgba(245,13,22,.25)}
.tabs{background:rgba(10,10,12,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid #3a0a0d;box-shadow:0 -6px 24px rgba(245,13,22,.08)}
.tabs button.on{color:#ff2530;text-shadow:0 0 10px rgba(245,13,22,.6)}
.tabs button.on svg{filter:drop-shadow(0 0 4px rgba(245,13,22,.7))}
.bar{background:#1c1c20}
.bar i{background:linear-gradient(90deg,#b00a12,#ff2530);box-shadow:0 0 8px rgba(245,13,22,.5)}
.bar.p i{background:linear-gradient(90deg,#7f93b5,#bfd0ee);box-shadow:none}
.bar.c i{background:linear-gradient(90deg,#9a9da5,#e6e8ec);box-shadow:none}
.bar.f i{background:linear-gradient(90deg,#c4231a,#ff6a5c);box-shadow:none}
.bar.good i{background:linear-gradient(90deg,#1d9f68,#3ecf8e);box-shadow:none}
.rg-fg{stroke:#ff2530;filter:drop-shadow(0 0 6px rgba(245,13,22,.7))}
.rg-bg{stroke:#1f1f23}
.stat{background:#17171a;border:1px solid #232327}
.note{background:#1d0508;border:1px solid #4a0b0f;color:#ffd9d9}
.tag.acc{background:#2b0709;color:#ff6b6b}
.rank{background:#2b0709;color:#ff6b6b}
.dn.on{box-shadow:0 0 10px rgba(62,207,142,.4)}
.restbar .in{background:#f1f1f3;color:#050506;box-shadow:0 0 0 1px #ff2530,0 8px 24px rgba(245,13,22,.35)}
.toast{background:#f1f1f3;color:#050506;box-shadow:0 0 0 1px #ff2530}
.sheet{background:#0a0a0c;border-top:1px solid #4a0b0f}
.shade{background:rgba(0,0,0,.72)}
input,select,textarea{background:#17171a;border-color:#2c2c31}
input:focus,select:focus,textarea:focus{outline:none;border-color:#ff2530;box-shadow:0 0 0 2px rgba(245,13,22,.25)}
.num.big,.kc{text-shadow:0 0 14px rgba(245,13,22,.18)}
.pr{color:#ff6b6b}
.gh .ms{stroke:#ff6b6b}
.ch .ln{stroke:#ff2530;filter:drop-shadow(0 0 4px rgba(245,13,22,.6))}
.ch .ar{fill:#ff2530;opacity:.14}
.ch .pt{fill:#ff2530}
.ch .ma{stroke:#c9ccd2}
.icon-btn{background:#141416;border-color:#2c2c31}
.sec-t{color:#e4e6ea;border-inline-start:3px solid var(--accent);padding-inline-start:8px}
::selection{background:#ff2530;color:#fff}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <div class="wrap">
    <header class="top">
      <div class="brand"><img src="Icons/icon-192.png" alt="SHADY SPILT" width="46" height="46"><div class="nm"><span class="n1">SHADY</span><span class="n2">SPILT</span></div></div>

    if (!window.claude || !window.claude.use) return Promise.resolve();
    return Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return null;
        var ref = db.doc('data/users/' + id + '/app');
        return ref.get().then(function (snap) {
          STORE.ref = ref;
          if (snap.exists) {
            var remote = null;
            try { remote = JSON.parse(snap.data().json); } catch (e) { }
            if (remote && remote.v === 1 && (remote.u || 0) > (S.u || 0)) {
              S = remote; migrate();
              try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { }
              render();
            } else flush();
            setSave('saved');
          } else { S.u = S.u || Date.now(); flush(); }
        });
      });
    }).catch(function () { });
  } catch (e) { return Promise.resolve(); }
}

}
function foodById(id) { var a = allFoods(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function dayEntries(d) { return S.food[d] || []; }

  var t = { k: 0, p: 0, c: 0, f: 0, cost: 0 };
  dayEntries(d).forEach(function (e) { t.k += e.k; t.p += e.p; t.c += e.c; t.f += e.f; t.cost += num(e.cost); });
  return t;

function recentFoods() {
  var seen = {}, out = [], ds = Object.keys(S.food).sort().reverse();
  for (var i = 0; i < ds.length && out.length < 10; i++) {
    var es = S.food[ds[i]];
    for (var j = es.length - 1; j >= 0 && out.length < 10; j--) {

/* ===== رسومات مساعدة ===== */
function ringSvg(val, max, label, sub) {

}
function macroBar(lbl, val, max, cls) {
  var p = max > 0 ? Math.min(100, val / max * 100) : 0;
  return '<div class="mb"><div class="mb-h"><span>' + lbl + '</span><b>' + r0(val) + ' / ' + r0(max) + ' جم</b></div><div class="bar ' + cls + '"><i style="width:' + p.toFixed(0) + '%"></i></div></div>';
}
function lineChart(pts, o) {
  o = o || {};
  if (!pts.length) return '';
  var W = 600, H = 210, pl = 46, pr = 14, pt = 14, pb = 28;
  var vs = pts.map(function (p) { return p.v; }).concat((o.ma || []).map(function (p) { return p.v; }));
  var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
  if (mn === mx) { mn -= 1; mx += 1; }
  var pv = (mx - mn) * 0.15; mn -= pv; mx += pv;
  var t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  var single = t0 === t1; if (single) { t0 -= 86400000; t1 += 86400000; }
  function X(t) { return pl + (t - t0) / (t1 - t0) * (W - pl - pr); }
  function Y(v) { return pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb); }
  var h = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="ch" role="img" aria-label="' + esc(o.label || 'رسم بياني') + '">';
  for (var i = 0; i < 4; i++) {
    var v = mn + (mx - mn) * i / 3, y = Y(v);
    h += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" class="gl"/><text x="' + (pl - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + r1(v) + '</text>';
  }
  var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ',' + Y(p.v).toFixed(1); }).join(' ');
  if (pts.length > 1) h += '<path d="' + line + ' L' + X(pts[pts.length - 1].t).toFixed(1) + ',' + (H - pb) + ' L' + X(pts[0].t).toFixed(1) + ',' + (H - pb) + ' Z" class="ar"/>';
  if (o.ma && o.ma.length > 1) h += '<path d="' + o.ma.map(function (p, i) { return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ',' + Y(p.v).toFixed(1); }).join(' ') + '" class="ma"/>';
  if (pts.length > 1) h += '<path d="' + line + '" class="ln"/>';
  pts.forEach(function (p, i) { h += '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (i === pts.length - 1 ? 5 : 3) + '" class="pt"/>'; });
  var xi = pts.length > 2 ? [0, Math.floor((pts.length - 1) / 2), pts.length - 1] : (pts.length === 2 ? [0, 1] : [0]);
  xi.forEach(function (i) { h += '<text x="' + X(pts[i].t).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(pts[i].l) + '</text>'; });
  return h + '</svg>';
}

function lastPerf(exId) {
  for (var i = S.sessions.length - 1; i >= 0; i--) {
    var s = S.sessions[i];
    for (var j = 0; j < s.ex.length; j++) if (s.ex[j].id === exId && s.ex[j].sets.length) return { d: s.d, sets: s.ex[j].sets };
  }
  return null;
}
function e1rm(w, r) { r = Math.min(Math.max(r, 1), 12); return r <= 1 ? w : w * (1 + r / 30); }
function bestE1(exId) {
  var b = 0;
  S.sessions.forEach(function (s) { s.ex.forEach(function (x) { if (x.id === exId) x.sets.forEach(function (st) { var v = e1rm(st.w, st.r); if (v > b) b = v; }); }); });
  return b;
}
function sessionVol(s) { var v = 0; s.ex.forEach(function (x) { x.sets.forEach(function (st) { v += st.w * st.r; }); }); return v; }
function sessionSets(s) { var n = 0; s.ex.forEach(function (x) { n += x.sets.length; }); return n; }
function mkDraftEx(id, sets, reps) {
  var lp = lastPerf(id), arr = [];
  for (var i = 0; i < (sets || 3); i++) {
    var pv = lp && lp.sets.length ? (lp.sets[i] || lp.sets[lp.sets.length - 1]) : null;
    arr.push({ w: pv ? pv.w : '', r: '', done: false });
  }
  return { id: id, reps: reps || '8-12', sets: arr };
}

  return (h ? pad(h) + ':' : '') + pad(m) + ':' + pad(s % 60);
}
function setsByMuscle(days) {

  days.forEach(function (d) {

function beep() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    var c = new AC(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(function () { o.stop(); c.close(); }, 350);
  } catch (e) { }
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { }
}
setInterval(function () {
  var e = $('#elapsed'); if (e && S && S.draft) e.textContent = elapsedTxt();
  var r = UI.rest;
  if (r) {
    var left = Math.ceil((r.end - Date.now()) / 1000), l = $('#restLeft');
    if (left <= 0) {
      if (!r.fin) { r.fin = true; beep(); }
      if (l) l.textContent = 'خلصت';
      if (Date.now() - r.end > 3000) { UI.rest = null; renderRest(); }
    } else if (l) l.textContent = fmtT(left);
  }
}, 500);

  if (!f) S.weights.push({ d: d, kg: kg });
  S.weights.sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });

  } catch (e) { toast('الملف مش نسخة صحيحة من التطبيق'); }
}
function scrollTop() { try { window.scrollTo(0, 0); } catch (e) { } }

/* ===== الإجراءات ===== */
var ACT = {
  tab: function (t) { UI.tab = t.dataset.t; UI.sheet = null; UI.arm = ''; render(); if (UI.tab === 'calcbot') botScroll(); else scrollTop(); },
  goFood: function () { UI.tab = 'food'; UI.date = today(); render(); scrollTop(); },
  gotoSplit: function () { UI.tab = 'work'; UI.wtab = 'split'; render(); scrollTop(); },
  closeSheet: function () { UI.sheet = null; render(); },
  water: function (t) { var d = today(); S.water[d] = Math.max(0, (S.water[d] || 0) + num(t.dataset.n)); saveSoon(); render(); },
  addWeightToday: function () { var v = num($('#wToday').value); if (addWeightEntry(today(), v)) { toast('تم تسجيل الوزن'); render(); } },
  addWeight: function () { var d = $('#wDate').value || today(); if (addWeightEntry(d, num($('#wKg').value))) { toast('تم تسجيل الوزن'); render(); } },
  delWeight: function (t) { S.weights = S.weights.filter(function (w) { return w.d !== t.dataset.d; }); if (S.weights.length) S.profile.weight = S.weights[S.weights.length - 1].kg; refreshTargets(); saveSoon(); render(); },
  addMeas: function () {
    var o = { d: today() }, any = false;
    MEAS.forEach(function (m) { var v = $('#m_' + m[0]).value; if (v !== '' && num(v) > 0) { o[m[0]] = num(v); any = true; } });
    if (!any) { toast('اكتب قياس واحد على الأقل'); return; }
    var last = S.meas[S.meas.length - 1];
    if (last && last.d === o.d) Object.keys(o).forEach(function (k) { last[k] = o[k]; }); else S.meas.push(o);
    saveSoon(); toast('تم حفظ القياسات'); render();
  },
  ptab: function (t) { UI.ptab = t.dataset.v; render(); },
  wtab: function (t) { UI.wtab = t.dataset.v; render(); },

  /* أكل */
  dateGo: function (t) { var d = addDays(UI.date, num(t.dataset.n)); if (d > today()) return; UI.date = d; render(); },
  dateToday: function () { UI.date = today(); render(); },
  addFood: function (t) { UI.sheet = { type: 'food', mode: 'list', meal: t.dataset.meal }; UI.fq = ''; UI.fc = 'all'; render(); },
  recipeMode: function () { UI.recipeItems = []; UI.recipeQ = ''; UI.recipeG = 100; UI.sheet.mode = 'recipe'; render(); },
  recipeAdd: function (t) { var f = foodById(t.dataset.id), g = num($('#recipeG').value,100); if (!f || g <= 0) { toast('اكتب كمية صحيحة بالجرام'); return; } var m=g/100; UI.recipeItems.push({id:f.id,n:f.n,g:g,k:f.k*m,p:f.p*m,c:f.c*m,f:f.f*m}); UI.recipeQ=''; render(); },
  recipeRemove: function (t) { UI.recipeItems.splice(+t.dataset.i,1); render(); },
  recipeSave: function () { var name=$('#recipeName').value.trim(), items=UI.recipeItems||[]; if(!name){toast('اكتب اسم الأكلة');return;} if(!items.length){toast('ضيف مكون واحد على الأقل');return;} var sum={g:0,k:0,p:0,c:0,f:0}; items.forEach(function(x){sum.g+=x.g;sum.k+=x.k;sum.p+=x.p;sum.c+=x.c;sum.f+=x.f;}); (S.food[UI.date]=S.food[UI.date]||[]).push({id:uid(),meal:UI.sheet.meal,fid:null,n:name+' (مكونات)',g:sum.g,k:sum.k,p:sum.p,c:sum.c,f:sum.f,cost:0,recipe:items}); saveSoon(); UI.sheet=null; toast('اتحسبت الأكلة واتضافت للوجبة'); render(); },
  botSend: function (t) { botSend(t.dataset.t); },
  botLog: function (t) {
    var b = botGet(); if (!b) return;
    var r = b.logDraft(t.dataset.meal), msgs = UI.botMessages || (UI.botMessages = []);
    msgs.push({ role: 'bot', text: r.text, plain: r.plain, notes: [], chips: [], kind: r.kind });
    if (r.kind === 'logged') toast('اتسجلت في ' + (MEALS.filter(function (m) { return m[0] === t.dataset.meal; })[0] || ['', ''])[1]);
    botSave(); render(); botScroll();
  },
  botDel: function (t) { var b = botGet(); if (b) { b.removeItem(t.dataset.id); botSave(); render(); } },
  botClearDraft: function () { var b = botGet(); if (!b) return; if (!arm('botclr')) { toast('اضغط تاني للتأكيد'); return; } b.clear(); botSave(); render(); },
  botClear: function () { if (!arm('botchat')) { toast('اضغط تاني لمسح المحادثة'); return; } var b = botGet(); if (b) b.clear(); UI.botMessages = []; botSave(); render(); },
  foodCat: function (t) { UI.fc = t.dataset.v; render(); },
  selFood: function (t) { var f = foodById(t.dataset.id); if (!f) return; UI.sheet = { type: 'food', mode: 'detail', meal: UI.sheet.meal, fid: f.id, g: f.g, cost: '' }; render(); },
  servMult: function (t) {
    var sh = UI.sheet, f = foodById(sh.fid); if (!f) return;
    sh.g = Math.round(f.g * num(t.dataset.x) * 10) / 10;
    var i = $('#fg'); if (i) i.value = sh.g;
    var m = $('#fmacros'); if (m) m.innerHTML = foodMacrosHtml(f, sh.g);
  },
  backFoods: function () { UI.sheet.mode = 'list'; render(); },
  customForm: function () { UI.sheet.mode = 'custom'; render(); },
  saveCustom: function () {
    var n = $('#cn').value.trim(), k = num($('#ck').value);
    if (!n || k <= 0) { toast('اكتب الاسم والسعرات'); return; }
    var c = { id: 'c' + uid(), n: n, k: k, p: num($('#cp').value), c: num($('#cc').value), f: num($('#cf').value), g: num($('#cg').value, 100) || 100, u: $('#cu').value.trim() || 'حصة' };
    S.customFoods.push(c); saveSoon();
    UI.sheet = { type: 'food', mode: 'detail', meal: UI.sheet.meal, fid: c.id, g: c.g, cost: '' }; render();
  },
  confirmFood: function () {
    var sh = UI.sheet, f = foodById(sh.fid); if (!f) return;
    var g = num($('#fg').value); if (g <= 0) { toast('اكتب الكمية بالجرام'); return; }
    var m = g / 100, d = UI.date;
    (S.food[d] = S.food[d] || []).push({ id: uid(), meal: sh.meal, fid: f.id, n: f.n, g: g, k: f.k * m, p: f.p * m, c: f.c * m, f: f.f * m, cost: num($('#fcost').value) });
    saveSoon(); UI.sheet = null; toast('تمت الإضافة'); render();
  },
  editEntry: function (t) { UI.sheet = { type: 'entry', date: UI.date, id: t.dataset.id }; render(); },
  saveEntry: function () {
    var sh = UI.sheet, e = dayEntries(sh.date).filter(function (x) { return x.id === sh.id; })[0]; if (!e) return;
    var g = num($('#eg').value); if (g <= 0) { toast('اكتب الكمية بالجرام'); return; }
    var fct = g / e.g; e.k *= fct; e.p *= fct; e.c *= fct; e.f *= fct; e.g = g;
    e.cost = num($('#ecost').value); e.meal = $('#emeal').value;
    saveSoon(); UI.sheet = null; render();
  },
  delEntry: function () { var sh = UI.sheet; S.food[sh.date] = dayEntries(sh.date).filter(function (x) { return x.id !== sh.id; }); saveSoon(); UI.sheet = null; render(); },

  /* تمرين */
  startSession: function (t) {
    if (S.draft) { toast('عندك جلسة شغالة'); UI.tab = 'work'; UI.wtab = 'today'; render(); return; }
    var i = parseInt(t.dataset.i), day = i >= 0 ? S.plan.days[i] : { n: 'تمرين حر', ex: [] };
    if (!day) return;
    S.draft = { dayIdx: i, n: day.n, t: Date.now(), ex: day.ex.map(function (e) { return mkDraftEx(e.id, e.sets, e.reps); }) };
    saveSoon(); UI.tab = 'work'; UI.wtab = 'today'; render(); scrollTop();
  },
  doneSet: function (t) {
    var ex = S.draft.ex[+t.dataset.x], s = ex.sets[+t.dataset.s];
    if (s.done) { s.done = false; s.pr = false; }
    else {
      if (s.r === '' || num(s.r) <= 0) s.r = String(parseInt(ex.reps) || 8);
      if (s.w === '') s.w = '0';
      s.done = true;
      var v = e1rm(num(s.w), num(s.r)), prev = bestE1(ex.id), bd = 0;
      ex.sets.forEach(function (o) { if (o !== s && o.done && o.ev) bd = Math.max(bd, o.ev); });
      s.ev = v;
      s.pr = num(s.w) > 0 && prev > 0 && v > prev + 0.01 && v > bd;
      if (s.pr) toast('رقم قياسي جديد في ' + (EX[ex.id] ? EX[ex.id].n : ''));
      startRest(S.restSec || 90);
    }
    saveSoon(); render();
  },
  addSet: function (t) { var ex = S.draft.ex[+t.dataset.x], last = ex.sets[ex.sets.length - 1]; ex.sets.push({ w: last ? last.w : '', r: '', done: false }); saveSoon(); render(); },
  delSet: function (t) { var ex = S.draft.ex[+t.dataset.x]; if (ex.sets.length > 1) { ex.sets.pop(); saveSoon(); render(); } },
  delSessEx: function (t) { S.draft.ex.splice(+t.dataset.x, 1); saveSoon(); render(); },
  cancelSession: function () { if (!arm('cancel')) return; S.draft = null; UI.rest = null; saveSoon(); render(); },
  finishSession: function () {
    var dr = S.draft, exs = [], prs = 0;
    dr.ex.forEach(function (x) {
      var ss = x.sets.filter(function (s) { return s.done; });
      ss.forEach(function (s) { if (s.pr) prs++; });
      if (ss.length) exs.push({ id: x.id, sets: ss.map(function (s) { return { w: num(s.w), r: num(s.r) }; }) });
    });
    if (!exs.length) { toast('علّم مجموعة واحدة على الأقل بعلامة الصح'); return; }
    var sess = { id: uid(), d: ymd(new Date(dr.t)), n: dr.n, di: dr.dayIdx, dur: Math.round((Date.now() - dr.t) / 60000), ex: exs };
    S.sessions.push(sess);
    if (dr.dayIdx >= 0) S.plan.lastIdx = dr.dayIdx;
    S.draft = null; UI.rest = null; saveSoon();
    toast('تم حفظ التمرين: ' + sessionSets(sess) + ' مجموعة' + (prs ? ' و ' + prs + ' رقم قياسي' : ''));
    render(); scrollTop();
  },
  viewSession: function (t) { UI.sheet = { type: 'session', id: t.dataset.id }; render(); },
  delSession: function (t) {
    if (!arm('ds' + t.dataset.id)) return;
    S.sessions = S.sessions.filter(function (s) { return s.id !== t.dataset.id; }); saveSoon(); UI.sheet = null; render();
  },
  restAdd: function (t) { if (UI.rest) { UI.rest.end += num(t.dataset.n) * 1000; renderRest(); } },
  restSkip: function () { UI.rest = null; renderRest(); },
  mvEx: function (t) {
    var d = S.plan.days[+t.dataset.di], i = +t.dataset.ei, j = i + num(t.dataset.n);
    if (j < 0 || j >= d.ex.length) return;
    var x = d.ex[i]; d.ex[i] = d.ex[j]; d.ex[j] = x; planTouch(); render();
  },
  rmEx: function (t) { S.plan.days[+t.dataset.di].ex.splice(+t.dataset.ei, 1); planTouch(); render(); },
  addDay: function () { S.plan.days.push({ n: 'يوم ' + (S.plan.days.length + 1), tag: '', ex: [] }); planTouch(); render(); },
  delDay: function (t) {
    if (!arm('day' + t.dataset.di)) return;
    S.plan.days.splice(+t.dataset.di, 1);
    if (S.plan.lastIdx >= S.plan.days.length) S.plan.lastIdx = -1;
    planTouch(); render();
  },
  pickEx: function (t) { UI.sheet = { type: 'pickEx', mode: t.dataset.mode, di: t.dataset.di }; render(); },
  pickExDo: function (t) {
    var sh = UI.sheet, id = t.dataset.id;
    if (sh.mode === 'plan') { S.plan.days[+sh.di].ex.push({ id: id, sets: 3, reps: '8-12' }); planTouch(); }
    else if (S.draft) { S.draft.ex.push(mkDraftEx(id, 3, '8-12')); saveSoon(); }
    UI.sheet = null; render();
  },
  exInfo: function (t) { UI.sheet = { type: 'exInfo', id: t.dataset.id }; render(); },
  addExPlan: function (t) {
    var di = +$('#addToDay').value;
    S.plan.days[di].ex.push({ id: t.dataset.id, sets: 3, reps: '8-12' }); planTouch();
    toast('اتضاف لـ ' + S.plan.days[di].n); UI.sheet = null; render();
  },
  libM: function (t) { UI.lm = t.dataset.v; render(); },
  libE: function (t) { UI.le = t.dataset.v; render(); },
  sdays: function (t) { UI.sd = parseInt(t.dataset.v); render(); },
  slevel: function (t) { UI.sl = t.dataset.v; render(); },
  useSplit: function (t) {
    var id = t.dataset.id;
    if (!S.plan.starter && !arm('split:' + id)) return;
    S.plan = { splitId: id, days: splitDays(id), lastIdx: -1, starter: false };
    saveSoon(); UI.wtab = 'today'; toast('اتغيّرت خطتك'); render(); scrollTop();
  },

  /* عضلات */
  muscle: function (t) { UI.mus = t.dataset.m; UI.anaHead = t.dataset.h || ''; render(); },
  anatomyPart: function (t) { UI.mus = t.dataset.m; UI.anaHead = t.dataset.h || ''; render(); },
  anatomyHead: function (t) { UI.anaHead = t.dataset.h || ''; render(); },
  muscleChip: function (t) { UI.mus = t.dataset.v; UI.mview = MUSCLES[UI.mus].view; UI.anaHead = ''; render(); },
  mzoom: function () { UI.mzoom = !UI.mzoom; render(); },
  mview: function (t) { UI.mview = t.dataset.v; UI.anaHead = ''; render(); },
  anaSex: function (t) { UI.anaSex = t.dataset.v === 'female' ? 'female' : 'male'; UI.mzoom = false; render(); },
  techM: function (t) { UI.techM = t.dataset.v; render(); },
  gotoMuscle: function (t) { UI.mus = t.dataset.m; UI.mview = MUSCLES[UI.mus].view; UI.tab = 'muscle'; UI.sheet = null; render(); scrollTop(); },

  /* إعدادات */
  pfChip: function (t) { S.profile[t.dataset.k] = t.dataset.v; refreshTargets(); saveSoon(); render(); },
  setupFinish: function () { var p=S.profile; if(num(p.age)<13||num(p.age)>100||num(p.height)<80||num(p.height)>250||num(p.weight)<20||num(p.weight)>400){toast('راجع السن والطول والوزن واكتب بيانات صحيحة');return;} S.setupComplete=true; S.weights.push({d:today(),kg:num(p.weight)}); refreshTargets(); saveSoon(); toast('اتحفظت بياناتك واتحسبت أهدافك'); UI.tab='today'; render(); },
  autoTargets: function () { S.targets = calcTargets(S.profile); saveSoon(); render(); },
  exportData: function () {
    var json = JSON.stringify(S, null, 1);
    var p = (window.claude && window.claude.use) ? window.claude.use('downloads') : Promise.resolve(null);
    p.then(function (dl) {
      if (!dl) { showExportBox(json); return; }
      return dl.save({ filename: 'shady-spilt-backup-' + today() + '.json', data: json }).then(function () { toast('تم حفظ النسخة'); }).catch(function (e) { if (!(e && e.code === 'declined')) showExportBox(json); });
    }).catch(function () { showExportBox(json); });
  },
  resetAll: function () {
    if (!arm('reset')) return;
    S = defaults(); UI.tab = 'today'; UI.sheet = null; saveSoon(); toast('تم مسح البيانات'); render();
  }
};

document.addEventListener('submit', function (e) {
  if (e.target && e.target.id === 'botForm') { e.preventDefault(); var inp = $('#botInput'), v = inp ? inp.value.trim() : ''; if (v) botSend(v, true); }
});
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-a]') : null;
  if (!t) return;
  var f = ACT[t.getAttribute('data-a')];
  if (f) f(t, e);
});
document.addEventListener('input', function (e) {
  var t = e.target, id = t.id, ds = t.dataset || {};
  if (ds.k && ds.x != null && S.draft) { var s = S.draft.ex[+ds.x].sets[+ds.s]; if (s) { s[ds.k] = t.value; saveSoon(); } return; }
  if (ds.pd) { S.plan.days[+ds.di].n = t.value; planTouch(); return; }
  if (ds.pk) { var ex = S.plan.days[+ds.di].ex[+ds.ei]; if (ds.pk === 'sets') ex.sets = Math.max(1, parseInt(t.value) || 1); else ex.reps = t.value; planTouch(); return; }
  if (id === 'techQ') { UI.techQ = t.value; var tl = $('#techList'); if (tl) tl.innerHTML = techListHtml(); return; }
  if (id === 'fq') { UI.fq = t.value; var l = $('#foodList'); if (l) l.innerHTML = foodListHtml(); return; }
  if (ds.botg != null) { var bb = botGet(); if (bb && bb.setGrams(ds.botg, num(t.value))) { botSave(); render(); } else { toast('اكتب الوزن بالجرام'); render(); } return; }
  if (id === 'recipeQ') { UI.recipeQ=t.value; var rm=$('#recipeMatches'); if(rm) rm.innerHTML=recipeMatchesHtml(allFoods().filter(function(f){return !UI.recipeQ.trim()||f.n.toLowerCase().indexOf(UI.recipeQ.trim().toLowerCase())>=0;}).slice(0,18)); return; }
  if (id === 'fg') { var sh = UI.sheet; if (sh && sh.type === 'food') { sh.g = num(t.value); var f = foodById(sh.fid), m = $('#fmacros'); if (f && m) m.innerHTML = foodMacrosHtml(f, sh.g); } return; }
  if (id === 'lq') { UI.lq = t.value; var l2 = $('#libList'); if (l2) l2.innerHTML = exListHtml(false); return; }
  if (id === 'pq') { UI.lq = t.value; var l3 = $('#pickList'); if (l3) l3.innerHTML = exListHtml(true); return; }
});
document.addEventListener('change', function (e) {
  var t = e.target, id = t.id, ds = t.dataset || {};
  if (ds.pf) { S.profile[ds.pf] = ds.pf === 'bf' ? t.value : num(t.value); refreshTargets(); saveSoon(); render(); return; }
  if (ds.tg) { S.targets[ds.tg] = Math.max(0, num(t.value)); S.targets.auto = false; saveSoon(); render(); return; }
  if (id === 'budget') { S.budget = Math.max(0, num(t.value)); saveSoon(); return; }
  if (id === 'restSel') { S.restSec = parseInt(t.value) || 90; saveSoon(); return; }
  if (id === 'peSel') { UI.pe = t.value; render(); return; }
  if (id === 'impFile') { var fl = t.files && t.files[0]; if (fl) { var r = new FileReader(); r.onload = function () { importJson(String(r.result)); }; r.readAsText(fl); } return; }
});

/* ===== التشغيل ===== */
(function boot() {
  var fresh = false;
  S = loadLocal();
  if (!S) { S = defaults(); fresh = true; } else migrate();
  render();
  if (fresh) saveSoon();
  connectDb();
})();
/* ===== تسجيل الـ service worker (للتثبيت والعمل بدون نت) ===== */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
}
